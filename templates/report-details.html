<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Reporte - Reporte Ciudadano</title>
    <link rel="stylesheet" href="../assets/css/report-details.css">
    <link rel="stylesheet" href="../assets/css/session-ui.css">
    <!-- Sesión con JWT: si no hay token vigente redirige a login.html -->
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/guard.js"></script>
</head>

<body class="details-page">

    <div id="shared-header"></div>

    <!-- Contenido Principal -->
    <main class="details-main-container">

        <!-- Barra Superior de Navegación -->
        <nav class="breadcrumb-container" id="breadcrumb-nav">
            <a class="back-link" href="my-reports.html">
                ← Volver a Mis Incidentes
            </a>
        </nav>

        <!-- Mensaje de carga / error -->
        <p id="details-message" class="details-message" role="alert">Cargando el reporte...</p>

        <!-- Tarjeta Contenedora Principal (la completa js/report-details.js desde /api/incidentes/{id}) -->
        <article class="details-card" id="details-card" hidden>

            <!-- Cabecera del Reporte -->
            <section class="details-card-header">
                <div class="header-left-meta">
                    <div class="badges-row">
                        <span class="incident-id-badge" id="detail-id"></span>
                        <span class="category-text" id="detail-tipo"></span>
                        <span class="status-pill" id="detail-estado"></span>
                    </div>

                    <h1 class="report-main-heading" id="detail-titulo"></h1>

                    <div class="timestamps-row">
                        <span class="timestamp-item">
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                            <time id="detail-fecha"></time>
                        </span>
                    </div>
                </div>
            </section>

            <!-- Grilla de Información Clave -->
            <section class="info-grid-container">
                <div class="info-card-block">
                    <span class="block-label">UBICACIÓN</span>
                    <strong class="block-title" id="detail-direccion"></strong>
                    <span class="block-subtitle" id="detail-zona"></span>
                </div>

                <div class="info-card-block">
                    <span class="block-label">PRIORIDAD</span>
                    <strong class="block-title" id="detail-prioridad"></strong>
                </div>

                <div class="info-card-block">
                    <span class="block-label">REPORTADO POR</span>
                    <strong class="block-title" id="detail-usuario"></strong>
                    <span class="block-subtitle" id="detail-usuario-email"></span>
                </div>
            </section>

            <!-- Sección de Evidencia Fotográfica -->
            <section class="evidence-section">
                <h2 class="section-block-title">EVIDENCIA FOTOGRÁFICA</h2>
                <div class="photo-container">
                    <img class="evidence-photo" id="detail-foto" src="../assets/img/camara.png" alt="">
                    <span class="photo-location-overlay" id="detail-foto-overlay"></span>
                </div>
                <div class="photo-thumbs" id="detail-miniaturas" hidden></div>
            </section>

            <!-- Sección de Descripción -->
            <section class="description-section">
                <h2 class="section-block-title">DESCRIPCIÓN</h2>
                <blockquote class="description-quote" id="detail-descripcion"></blockquote>
            </section>

        </article>

    </main>

    <footer></footer>

    <script src="../js/header.js"></script>
    <script src="../js/session-ui.js"></script>
    <script src="../js/report-details.js"></script>

</body>

</html>
