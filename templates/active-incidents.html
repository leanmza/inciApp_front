<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidentes Activos - Reporte Ciudadano</title>
    <link rel="stylesheet" href="../assets/css/active-incidents.css">
    <link rel="stylesheet" href="../assets/css/session-ui.css">
    <!-- Página pública: no usa guard.js (se ve con o sin sesión iniciada) -->
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
</head>

<body>

   <div id="shared-header"></div>

    <!-- Contenedor Principal de la Página -->
    <main class="page-container">

        <!-- 1. Encabezado Hero -->
        <section class="incidents-hero-section">
            <div class="hero-text-content">
                <span class="portal-badge">• PORTAL COMUNAL ABIERTO</span>
                <h1 class="hero-title">Incidentes en Curso</h1>
                <p class="hero-subtitle">Seguimiento en tiempo real y transparente de los reclamos vecinales.</p>
            </div>
            <div class="hero-counter-badge">
                <span class="status-dot"></span> <span id="incidents-counter">Cargando...</span>
            </div>
        </section>

        <!-- 2. Barra de Búsqueda y Filtros -->
        <section class="filters-section">
            <form class="filters-form" id="filters-form" role="search">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input class="search-input" type="search" id="filter-search" aria-label="Buscar incidentes" placeholder="Buscar por código, calle, zona o categoría...">
                </div>

                <div class="filter-dropdown-wrapper">
                    <select class="filter-select" id="filter-severity" aria-label="Filtrar por prioridad">
                        <option value="all">Todas las prioridades</option>
                        <option value="high">Prioridad Alta</option>
                        <option value="medium">Prioridad Media</option>
                        <option value="low">Prioridad Baja</option>
                        <option value="none">Sin prioridad asignada</option>
                    </select>
                </div>
            </form>
        </section>

        <!-- 3. Lista de Incidentes Activos (la carga js/active-incidents.js desde /api/incidentes) -->
        <section class="active-incidents-section" id="active-incidents-list-section">
            <p id="incidents-message" class="reports-message" role="alert" hidden></p>
            <div class="incidents-list" id="incidents-list" aria-live="polite">
                <p class="reports-empty">Cargando incidentes...</p>
            </div>
        </section>

        <!-- 4. Paginación (se muestran de a tandas; "Cargar más" agrega la siguiente) -->
        <section class="pagination-section" id="pagination-section" hidden>
            <p class="pagination-info" id="pagination-info"></p>
            <div class="pagination-controls">
                <button class="btn-pagination btn-primary" type="button" id="load-more-btn">Cargar más</button>
            </div>
        </section>

    </main>

    <footer></footer>

    <script src="../js/header.js"></script>
    <script src="../js/session-ui.js"></script>
    <script src="../js/active-incidents.js"></script>

</body>

</html>
