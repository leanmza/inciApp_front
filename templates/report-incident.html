<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Incidente - Reporte Ciudadano</title>
    <link rel="stylesheet" href="../assets/css/report-incident.css">
    <link rel="stylesheet" href="../assets/css/session-ui.css">
    <!-- Sesión con JWT: si no hay token vigente redirige a login.html -->
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/guard.js"></script>
</head>

<body class="report-page">

    <div id="shared-header"></div>

    <!-- Contenido Principal -->
    <main class="report-main-container">

        <!-- Encabezado de la página -->
        <section class="report-header-section">
            <div class="header-icon-circle">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </div>
            <h1 class="report-title">Registrar Incidente</h1>
            <p class="report-subtitle">Reporte vecinal anónimo y directo para cuadrillas municipales</p>
        </section>

        <!-- Tarjeta del Formulario -->
        <section class="form-card">
            <form class="report-form" id="report-form" novalidate>

                <!-- 1. Categoría del reporte: los botones se generan desde GET /api/tipos -->
                <div class="form-step">
                    <label class="step-label" id="category-label">1. CATEGORÍA DEL REPORTE <span class="required-asterisk">*</span></label>
                    <div class="category-grid" id="category-grid" role="radiogroup" aria-labelledby="category-label">
                        <span class="dropzone-subtitle">Cargando categorías...</span>
                    </div>
                    <input type="hidden" id="incident-tipo" name="idTipo">
                </div>

                <!-- 2. Ubicación del incidente -->
                <div class="form-step">
                    <label class="step-label">2. UBICACIÓN DEL INCIDENTE <span class="required-asterisk">*</span></label>

                    <div class="location-grid">
                        <div class="location-field">
                            <label class="field-label" for="incident-provincia">Provincia</label>
                            <select class="select-input" id="incident-provincia" name="idProvincia" required>
                                <option value="">Cargando...</option>
                            </select>
                        </div>

                        <div class="location-field">
                            <label class="field-label" for="incident-departamento">Departamento</label>
                            <select class="select-input" id="incident-departamento" name="idDepartamento" required disabled>
                                <option value="">Selecciona primero la provincia</option>
                            </select>
                        </div>

                        <div class="location-field">
                            <label class="field-label" for="incident-localidad">Localidad</label>
                            <select class="select-input" id="incident-localidad" name="idLocalidad" required disabled>
                                <option value="">Selecciona primero el departamento</option>
                            </select>
                        </div>
                    </div>

                    <div class="step-label-row">
                        <label class="field-label" for="incident-location">Dirección</label>
                        <button type="button" class="gps-btn" id="gps-btn">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <circle cx="12" cy="12" r="3"></circle>
                                <line x1="12" y1="2" x2="12" y2="4"></line>
                                <line x1="12" y1="20" x2="12" y2="22"></line>
                                <line x1="2" y1="12" x2="4" y2="12"></line>
                                <line x1="20" y1="12" x2="22" y2="12"></line>
                            </svg>
                            Usar GPS actual
                        </button>
                    </div>
                    <div class="input-with-icon">
                        <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <input class="text-input" type="text" id="incident-location" name="direccion" placeholder="Ej: San Martín 1420 esq. Belgrano" maxlength="255" required>
                    </div>
                </div>

                <!-- 3. Evidencia fotográfica (el back exige al menos una imagen) -->
                <div class="form-step">
                    <label class="step-label">3. EVIDENCIA FOTOGRÁFICA <span class="required-asterisk">*</span></label>

                    <!-- Zona de arrastre / Carga -->
                    <div class="upload-dropzone" id="upload-dropzone">
                        <input type="file" id="photo-evidence" name="images" accept="image/png, image/jpeg" multiple class="file-input-hidden">
                        <label for="photo-evidence" class="dropzone-trigger">
                            <div class="camera-icon-circle">
                                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                    <circle cx="12" cy="13" r="4"></circle>
                                </svg>
                            </div>
                            <div class="dropzone-text">
                                <span class="dropzone-title">Adjuntar foto o arrastrar archivo</span>
                                <span class="dropzone-subtitle">JPG o PNG, hasta 3 MB en total</span>
                            </div>
                        </label>
                    </div>

                    <!-- Vista previa de los archivos cargados (la genera report-incident.js) -->
                    <div id="file-preview-list"></div>
                </div>

                <!-- 4. Descripción (el back la exige: @NotBlank) -->
                <div class="form-step">
                    <div class="step-label-row">
                        <label class="step-label" for="additional-details">4. DESCRIPCIÓN <span class="required-asterisk">*</span></label>
                        <span class="char-counter" id="char-counter">0/240</span>
                    </div>
                    <textarea class="textarea-input" id="additional-details" name="descripcion" rows="3" maxlength="240" placeholder="Describí brevemente el problema para la cuadrilla de resolución..." required></textarea>
                </div>

                <div class="form-message" id="report-message" role="alert" aria-live="polite" hidden></div>

                <!-- Acciones del Formulario -->
                <div class="form-actions">
                    <a href="../index.html" class="btn-cancel">Cancelar</a>
                    <button type="submit" class="btn-submit" id="report-submit">
                        Enviar Reporte
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>

            </form>
        </section>

        <!-- Mensaje de Privacidad -->
        <p class="privacy-note">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Tus datos de contacto nunca son compartidos públicamente.
        </p>

    </main>

    <footer></footer>

    <script src="../js/header.js"></script> 
    <script src="../js/session-ui.js"></script>
    <script src="../js/ubicaciones.js"></script>
    <script src="../js/report-incident.js"></script>

</body>

</html>
