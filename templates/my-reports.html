<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Incidentes - Reporte Ciudadano</title>
    <link rel="stylesheet" href="../assets/css/my-reports.css">
    <link rel="stylesheet" href="../assets/css/session-ui.css">
    <!-- Sesión con JWT: si no hay token vigente redirige a login.html -->
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/guard.js"></script>
</head>

<body class="my-reports-page">
    
    <div id="shared-header"></div>

    <!-- Contenido Principal -->
    <main class="my-reports-container">

        <!-- Encabezado de la página -->
        <section class="my-reports-header">
            <div class="header-text-group">
                <h1 class="page-main-title">Mis Incidentes</h1>
                <p class="page-main-subtitle">Seguimiento en tiempo real de tus reclamos reportados</p>
            </div>
            <div class="header-stats">
                <span id="reports-counter" class="counter-text"></span>
            </div>
        </section>

        <!-- Barra de Filtros y Búsqueda -->
        <section class="reports-filter-bar">
            <div class="filter-tabs-group">
                <button type="button" class="tab-btn active" data-filtro="todos">Todos los reportes</button>
                <button type="button" class="tab-btn" data-filtro="activos">Solo activos</button>
                <button type="button" class="tab-btn" data-filtro="finalizados">Finalizados</button>
            </div>
            <div class="search-input-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="search" id="reports-search" class="search-field" aria-label="Buscar incidentes" placeholder="Buscar por código, calle o tema...">
            </div>
        </section>

        <!-- Lista de Incidentes (la carga js/my-reports.js desde /api/incidentes/user/me) -->
        <section class="user-reports-list">
            <p id="reports-message" class="reports-message" role="alert" hidden></p>
            <div id="incidents-list" class="incidents-list" aria-live="polite">
                <p class="reports-empty">Cargando tus incidentes...</p>
            </div>
        </section>

    </main>

    <footer></footer>

    <script src="../js/header.js"></script>
    <script src="../js/session-ui.js"></script>
    <script src="../js/my-reports.js"></script>

</body>

</html>
